services:
  api:
    build: .
    ports:
      # Default 8000; set REDRUN_PORT if something else already owns 8000.
      - "${REDRUN_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SAMPLE_MODE: ${SAMPLE_MODE:-true}
      REDRUN_ROOT: /app
      # Inside the container, the host runtime is not 127.0.0.1.
      METERLESS_BASE_URL: http://host.docker.internal:8088/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
